
name: Test connessione Tailscale

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Collega Tailscale e usa il nodo di casa
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest
          args: --exit-node=${{ secrets.TS_EXIT_NODE_IP }} --exit-node-allow-lan-access
          ping: ${{ secrets.TS_EXIT_NODE_IP }}

      - name: Verifica connessione Tailscale
        run: |
          tailscale status
          tailscale ping ${{ secrets.TS_EXIT_NODE_IP }}

      - name: Verifica IP pubblico
        run: |
          echo "IP pubblico utilizzato:"
          curl -4 -s https://api.ipify.org
          echo
